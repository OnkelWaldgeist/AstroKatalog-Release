<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroKatalog Field Check</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #181a20;
            --accent-red: #ff453a;
            --accent-orange: #ff9f0a;
            --text-main: #f2f2f7;
            --text-muted: #8e8e93;
            --border-color: #2c2c2e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.3rem;
            color: var(--accent-red);
            margin: 0 0 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .update-info {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: normal;
        }

        /* Controls / Import */
        .file-input-container {
            margin-bottom: 16px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            display: block;
            text-align: center;
            background: #2c2c2e;
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* Search & Filter Bar */
        .search-box {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-red);
        }

        .chips-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .chip {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .chip.active {
            background: var(--accent-red);
            color: #fff;
            border-color: var(--accent-red);
        }

        /* Object List */
        .object-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .object-card {
            background: var(--card-bg);
            border-left: 4px solid var(--accent-red);
            border-radius: 6px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .object-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .object-details {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .object-exposure {
            text-align: right;
        }

        .exposure-val {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-orange);
            font-family: monospace;
        }

        .sessions-cnt {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>
        <span>🔭 AstroKatalog</span>
        <span class="update-info" id="updateDate">Keine Daten</span>
    </h1>

    <div class="file-input-container">
        <label for="jsonFile" class="custom-file-upload">
            📂 katalog_index.json laden / aktualisieren
        </label>
        <input type="file" id="jsonFile" accept=".json">
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="Suche (z.B. M34, NGC 7000, 31)..." autocomplete="off">

    <div class="chips-container">
        <button class="chip active" onclick="setFilter('ALL', this)">Alle</button>
        <button class="chip" onclick="setFilter('M', this)">Messier (M)</button>
        <button class="chip" onclick="setFilter('NGC', this)">NGC</button>
        <button class="chip" onclick="setFilter('IC', this)">IC</button>
        <button class="chip" onclick="setFilter('SHORT', this)">&lt; 1 Std.</button>
        <button class="chip" onclick="setFilter('LONG', this)">&gt; 2 Std.</button>
    </div>

    <div class="object-list" id="objectList">
        <div class="empty-state">Bitte lade deine `katalog_index.json`, um deinen Katalog auf dem Handy zu nutzen.</div>
    </div>

    <script>
        let catalogData = [];
        let currentFilter = 'ALL';

        // Beim Start: Aus LocalStorage laden (Offline-Fähigkeit!)
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('astro_catalog_cache');
            const savedDate = localStorage.getItem('astro_catalog_date');
            
            if (savedData) {
                catalogData = JSON.parse(savedData);
                document.getElementById('updateDate').innerText = savedDate ? `Stand: ${savedDate}` : '';
                renderList();
            }
        });

        // Datei-Import
        document.getElementById('jsonFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const json = JSON.parse(event.target.result);
                    catalogData = json.objects || [];
                    const updateStr = json.updatedAt || new Date().toLocaleDateString();

                    // Im LocalStorage sichern
                    localStorage.setItem('astro_catalog_cache', JSON.stringify(catalogData));
                    localStorage.setItem('astro_catalog_date', updateStr);

                    document.getElementById('updateDate').innerText = `Stand: ${updateStr}`;
                    renderList();
                } catch (err) {
                    alert("Fehler beim Lesen der JSON-Datei!");
                }
            };
            reader.readAsText(file);
        });

        // Live-Suche
        document.getElementById('searchInput').addEventListener('input', () => {
            renderList();
        });

        function setFilter(filterType, element) {
            currentFilter = filterType;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            renderList();
        }

        function renderList() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase().replace(/\s+/g, '');
            const container = document.getElementById('objectList');
            container.innerHTML = '';

            const filtered = catalogData.filter(item => {
                const nameClean = item.name.toLowerCase().replace(/\s+/g, '');
                
                // Text-Suche
                const matchesQuery = query === '' || nameClean.includes(query);

                // Kategorien-Filter
                let matchesFilter = true;
                if (currentFilter === 'M') matchesFilter = nameClean.startsWith('m') && !nameClean.startsWith('ngc');
                else if (currentFilter === 'NGC') matchesFilter = nameClean.startsWith('ngc');
                else if (currentFilter === 'IC') matchesFilter = nameClean.startsWith('ic');
                else if (currentFilter === 'SHORT') matchesFilter = item.totalExposureMin < 60;
                else if (currentFilter === 'LONG') matchesFilter = item.totalExposureMin >= 120;

                return matchesQuery && matchesFilter;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state">Kein Objekt gefunden.</div>`;
                return;
            }

            filtered.forEach(item => {
                const hours = (item.totalExposureMin / 60).toFixed(1);
                
                const card = document.createElement('div');
                card.className = 'object-card';
                card.innerHTML = `
                    <div>
                        <div class="object-name">${item.name}</div>
                        <div class="object-details">📅 Letzte: ${item.lastDate}</div>
                    </div>
                    <div class="object-exposure">
                        <div class="exposure-val">${hours} h</div>
                        <div class="sessions-cnt">${item.sessionsCount} Session${item.sessionsCount > 1 ? 's' : ''} (${Math.round(item.totalExposureMin)} min)</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
